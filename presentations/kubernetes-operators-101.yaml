apiVersion: presentations.haavard.dev/v1alpha1
kind: Presentation
metadata:
  name: kubernetes-operators-101
spec:
  theme:
    primaryColor: "#FFFFFF"
    secondaryColor: "#3366FF"
    backgroundColor: "#000000"
    fontFamily: "'Neue Haas Grotesk Pro', 'Neue Haas Grotesk', sans-serif"
    logo: "https://i.imgur.com/f9KKoJq.png"
  slides:
    - title: ""
      layout: cover
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/fagfestival-2026.png"
          alt: "SoftwareOne fagfestival 2026"
      notes: "La coveret stå mens folk setter seg etter pausen. Ikke start på ordet — pust."
    - title: "Bjørn viste dere golden paths. Men hva ER en golden path — teknisk sett?"
      notes: "Hengende spørsmål i Bjørns hook-stil. Ikke svar — la det jobbe 3-4 sek, klikk videre. Svaret er resten av foredraget."
    - title: ""
      images:
        # Kilde: export/assets/whoami/whoami.html (re-render med chromium --headless --screenshot)
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/whoami-haavasma.png"
          alt: "whoami — Håvard, utvikler i skyttergraven"
      notes: "~30 sek. Samme terminal-stil som Bjørns bio — visuell kontinuitet. Etabler perspektivet: jeg er utvikleren som lever i dette."
    - title: "Diagnosen — sett fra skyttergraven"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/problem-toil.gif"
          alt: "Måneder med tickets for ett endepunkt"
      bullets:
        - "Ett endepunkt ut på internett: security, ingress, DNS — måneder med tickets, møter og clickops"
        - "Koden tok en ettermiddag. Driften tok et kvartal."
        - "Kunnskapen ble liggende i Confluence, Slack-tråder og folks hoder"
        - "Neste team som trenger det samme? Starter fra null."
        - "Hvordan koder vi bort dette?"
      notes: "Dere kjenner igjen dette fra Bjørns diagnose — her er min versjon. Kort — dette er bekreftelse, ikke ny motivasjon. Siste bullet er broen inn i stigen."
    - title: "Steg 1: Kubernetes"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/k8s-reconcile.gif"
          alt: "Kubernetes reconciler ønsket tilstand: pod dør, controller erstatter den"
      bullets:
        - "Deklarativ orkestrator for containere"
        - "Ønsket tilstand i YAML — controllere reconciler mot den"
        - "Innebygde byggeklosser: Deployment, Service, Ingress, ConfigMap ..."
        - "Selvhelende kontrollsløyfer håndterer drift og feil"
    - title: "Steg 2: GitOps"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/gitops-sync.gif"
          alt: "Git-commit flyter gjennom GitOps-agent inn i clusteret"
      bullets:
        - "Git som eneste kilde til sannhet for cluster-tilstand"
        - "En agent syncer kontinuerlig repo → cluster"
        - "Auditerbart, reviewbart, reproduserbart — dette er delivery plane-en fra Bjørns IDP-anatomi"
        - "Men: bare så uttrykksfullt som ressursene du applyer"
        - "Komplekse apper trenger fortsatt glue-scripts, Helm-triks og manuelle steg"
      notes: "Callback: pek tilbake på Bjørns fem planes. Siste to bullets er setup for CRD-steget."
    - title: "Steg 3: Custom Resources"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/crd-abstraction.gif"
          alt: "Definer en CRD for Greeting, opprett så en Greeting-instans"
      bullets:
        - "CRD = schema-definisjon (som en klasse)"
        - "CR = instans av typen (som et objekt)"
        - "kubectl behandler CR-er som hvilken som helst innebygd ressurs"
        - "CRD-en er kontrakten i en golden path — porten i Bjørns ports & adapters"
        - "Men en CR alene er død data — den trenger en controller"
    - title: "Så ... hvorfor bry seg?"
      bullets:
        - "Utvid Kubernetes-APIet med dine egne ressurstyper"
        - "Domenespesifikke abstraksjoner: Database, Presentation, Pipeline"
        - "Utviklere skriver high-level spec — ikke low-level plumbing"
        - "GitOps funker fortsatt — nå over *dine* abstraksjoner"
    - title: "Steg 4: Operator SDK"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/operator-reconcile.gif"
          alt: "Reconciliation loop: watch CR, diff ønsket vs faktisk tilstand, apply"
      bullets:
        - "Rammeverk for å bygge controlleren bak en CRD"
        - "Operasjonell kunnskap kodet som en reconciliation loop"
        - "Runbooks blir kode som kjører 24/7"
        - "«Gjør det slik — så er resten vårt problem» — som kjørende kode"
      notes: "Callback til Bjørns golden path-slide. Dette er punchlinen på stigen: operatoren ER golden path-en, teknisk sett."
    - title: ""
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/operator-exposedapp.gif"
          alt: "ExposedApp-operator fanner ut til security, akamai, DNS, change board — det som tok måneder, tar nå sekunder"
      notes: "Lukk toil-løkken: dette er kvartalet fra åpningen — nå som sekunder. La GIF-en jobbe."
    - title: "Når bør du lage en CRD — og når ikke?"
      bullets:
        - "Lag en når: samme ops gjentas på tvers av team, runbooken er stabil, livssyklusen er ikke-triviell"
        - "Lag en når: du styrer ekstern tilstand (skyressurser, SaaS, databaser) fra clusteret"
        - "Dropp det når: et Helm-chart, en Job eller en vanlig Deployment gjør jobben"
        - "Dropp det når: abstraksjonen er ett team, én app — «bygg for deg selv»-fella fra Bjørns anti-mønstre"
        - "Operators er leverage. Ikke bygg leverage du ikke får gjenbrukt."
      notes: "Callback til Bjørns tre feilmønstre. Dette er anti-hype-sliden — den bygger troverdighet før demoen."
    - title: "DEMO"
    - title: "Hva demoen nettopp viste"
      images:
        - url: "https://github.com/Haavasma/operator-sdk-demo-v2/releases/download/videos-v2/operator-presentation.gif"
          alt: "Presentation CR reconciled til ConfigMap, Deployment, Service, Gateway, HTTPRoute"
      bullets:
        - "Én Presentation CR = fem Kubernetes-ressurser"
        - "ConfigMap: Marp markdown generert fra spec-en"
        - "Deployment + Service: marp-cli server"
        - "Gateway + HTTPRoute: ruter <name>.<ns>.localhost"
        - "Og slidene dere ser på akkurat nå? En Presentation CR i git — dette foredraget ble deployet med git push."
      notes: "Meta-avsløringen er beatet på sliden — la den lande med pause. Bevis på at vi følger vår egen lære."
    - title: "Slutt å klikke. Begynn å deklarere."
      bullets:
        - "Kubernetes: deklarativ orkestrering, selvhelende sløyfer"
        - "GitOps: repo som kilde til sannhet, kontinuerlig sync"
        - "CRD-er: utvid APIet med dine egne domenetyper"
        - "Operators: runbooks som reconciliation loops — 24/7"
        - "Ops blir kode — versjonert, reviewbart, repeterbart"
        - "Sjekk selv: github.com/Haavasma/operator-sdk-demo-v2"
      notes: "Oppsummering — ikke les bullets, de har hørt alt. Muntlig bro: «og hvordan dette ser ut i full skala — det viser Marius dere nå.»"
    - title: "Samme mønster driver Canopy"
      bullets:
        - "I Canopy heter CR-en Application"
        - "Én Application CR → Git-repo, namespaces per miljø, Gateway med listener per miljø"
        - "→ CI-pipeline og ArgoCD ApplicationSets: tst, prd og preview-miljø per PR"
        - "→ automatisk image-oppdatering ved ny release"
        - "Fra onboarding til app i prod — én ressurs, én operator"
        - "Marius viser dere den nå."
      notes: "Siste slide — står på skjermen inn i Marius' del og blir hans intro. Ingen visuals: han eier opplevelsen, du har gitt publikum mønsteret å se den gjennom."
